[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "humidex"
version = "4.0.0"
description = "Retrieve humidex values for any location using ECMWF open data"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Humidex Contributors"}
]
keywords = ["weather", "humidex", "ecmwf", "climate", "comfort"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

dependencies = [
    "ecmwf-opendata>=0.3.0",
    "thermofeel>=2.0.0",
    "geopy>=2.4.0",
    "xarray>=2024.0.0",
    "cfgrib>=0.9.14",
    "click>=8.1.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "types-requests",
]

[project.urls]
Homepage = "https://github.com/user/humidex"
Documentation = "https://github.com/user/humidex#readme"
Repository = "https://github.com/user/humidex"

[project.scripts]
humidex = "humidex.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "RUF"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["humidex"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src/humidex --cov-report=term-missing"
